[package]
name = "confluence-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
confluence-core = { path = "../confluence-core" }
confluence-api = { path = "../confluence-api" }
confluence-rt = { path = "../confluence-rt" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
confluence-client = { path = "../confluence-client" }
confluence-plugin-host = { path = "../confluence-plugin-host" }
confluence-provider-asio = { path = "../confluence-provider-asio" }
confluence-provider-wasapi = { path = "../confluence-provider-wasapi" }
confluence-provider-vasio = { path = "../confluence-provider-vasio" }
confluence-provider-vaio = { path = "../confluence-provider-vaio" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_IO",
] }

[dev-dependencies]
confluence-vasio = { path = "../confluence-vasio" }
confluence-provider-vasio = { path = "../confluence-provider-vasio" }
tempfile = "3"
assert_no_alloc.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
