[package]
name = "confluence-app"
version = "0.1.0"
description = "Confluence desktop GUI"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "confluence"
path = "src/main.rs"

[dependencies]
confluence-api = { path = "../confluence-api" }
confluence-client = { path = "../confluence-client" }
eframe = { version = "0.36", features = ["persistence"] }
serde.workspace = true
serde_json.workspace = true
toml = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
egui_kittest = "0.36"
tempfile = "3"
confluence-provider-vasio = { path = "../confluence-provider-vasio" }
confluence-engine = { path = "../confluence-engine" }
confluence-core = { path = "../confluence-core" }
confluence-net = { path = "../confluence-net" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lints]
workspace = true
