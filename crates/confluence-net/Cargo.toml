[package]
name = "confluence-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Confluence network audio: RTP streams between engines, and discovery"

[dependencies]
confluence-api = { path = "../confluence-api" }
confluence-core = { path = "../confluence-core" }
confluence-rt = { path = "../confluence-rt" }
rtrb.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media", "Win32_NetworkManagement_Dns", "Win32_Networking_WinSock"] }

[lints]
workspace = true

