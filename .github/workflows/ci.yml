name: ci
# One run per PR (pull_request) plus one on main after a merge: a push to a
# PR branch would otherwise start the same job twice.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Builds the VASIO cdylib too: one test loads the built DLL like a DAW does.
      - run: cargo build --workspace
      # --no-fail-fast: one failing crate must not hide the results of the others.
      - run: cargo test --workspace --no-fail-fast
      - run: cargo test -p confluence-core --test bridge_sim --release
      - name: loom
        shell: bash
        run: RUSTFLAGS="--cfg loom" CARGO_TARGET_DIR=target/loom cargo test -p confluence-core --test loom_mailbox --release
